name: deploy 🚀

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /var/www/davelopment-booking && bash .github/workflows/deploy.sh"

      - name: Smoke test
        run: |
          sleep 20
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://booking.davelopment.hu/ || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Smoke test sikertelen: HTTP $STATUS"
            exit 1
          fi
          echo "✅ Smoke test OK: HTTP $STATUS"
